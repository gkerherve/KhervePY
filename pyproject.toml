[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "khervepy"
dynamic = ["version"]
description = "A lightweight, GitHub-first Python IDE built on Qt."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Gwilherm Kerherve" }]
dependencies = [
    "PyQt6>=6.5",
    "PyQt6-QScintilla>=2.14",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0"]

[project.scripts]
khervepy = "khervepy.app:main"

[project.gui-scripts]
KhervePY = "khervepy.app:main"

[tool.setuptools]
packages = ["khervepy"]

[tool.setuptools.dynamic]
version = { attr = "khervepy.__version__" }
